name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t api:ci apps/api-java
      - run: docker build -t worker:ci apps/worker-node
      - run: docker build -t web:ci apps/web-frontend
      - run: docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
